[package]
name = "oa-volume-controller"
version = "1.2.0"
edition = "2024"
description = "OpenDeck plugin for per-application, dynamic-group, and audio-device volume control on Linux"
repository = "https://github.com/picturescu/opendeck-volume-dial-controller"
homepage = "https://github.com/picturescu/opendeck-volume-dial-controller"
license = "MIT"
keywords = ["opendeck", "stream-deck", "pulseaudio", "pipewire", "audio"]
categories = ["multimedia::audio"]

[dependencies]
openaction = "2.7"
tokio = { version = "1.45", features = ["full"] }
log = "0.4"
simplelog = "0.12"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.5"
async-trait = "0.1"
libpulse-binding = "2.30"
anyhow = "1.0"
image = "0.24"
base64 = "0.22"
tux-icons = "0.4.4"
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
tempfile = "3.20"
