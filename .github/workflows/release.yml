name: Tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev nodejs python3 zip unzip
      - name: Verify tag and manifest version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["Version"])')"
          test "${GITHUB_REF_NAME}" = "v${manifest_version}"
          test -f "docs/RELEASE_NOTES_${manifest_version}.md"
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          python3 -m json.tool manifest.json >/dev/null
          git diff --check
          for file in *.html; do
            if grep -q '<script' "$file"; then
              sed -n '/<script>/,/<\/script>/p' "$file" | sed '1d;$d' | node --check
            fi
          done
          if test -d pi; then
            find pi -type f -name '*.js' -print0 |
              while IFS= read -r -d '' file; do node --check "$file"; done
          fi
      - name: Package
        run: ./scripts/package-release.sh
      - name: Validate package
        run: |
          archive="$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
          unzip -t "$archive"
          test -f "${archive}.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="docs/RELEASE_NOTES_${version}.md"
          archive="dist/opendeck-volume-dial-controller-v${version}-linux-x86_64.zip"
          checksum="${archive}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "OpenDeck Volume Dial Controller ${version}" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --title "OpenDeck Volume Dial Controller ${version}" \
              --notes-file "$notes"
          fi
